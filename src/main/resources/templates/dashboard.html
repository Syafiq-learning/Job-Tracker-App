<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="glow-circle"></div>
  <nav class="navbar navbar-expand-lg navbar-light bg-transparent mx-3 mt-1 mb-3">
    <div class="container">
      <a class="navbar-brand fw-bold" href="dashboard.html">Tracker</a>
      <div >
        <a class="navbar-brand " href="#">Logout</a>
      </div>
    </div>

  </nav>
  <div class="container mt-5">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-4">
      <!-- Repeat .col div 5+ times -->
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Total</h5>
            <p class="card-text">Content</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Applied</h5>
            <p class="card-text">Content</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Interview</h5>
            <p class="card-text">Content</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Offer</h5>
            <p class="card-text">Content</p>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Rejected</h5>
            <p class="card-text">Content</p>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
