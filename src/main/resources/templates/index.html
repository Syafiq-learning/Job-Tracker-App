<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tracker - Job Application Tracker</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #0f2027, #203a43);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
            color: white;
            overflow-x: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
        }

        .glow-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #0dcaf0;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.3;
            top: 20%;
            left: 10%;
        }

        .glow-circle2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: #ffc107;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.3;
            bottom: 10%;
            right: 10%;
        }
    </style>
</head>
<body>

<div class="glow-circle"></div>
<div class="glow-circle2"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-transparent">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">Tracker</a>
        <div>
            <a href="/login" class="btn btn-outline-light me-2">Login</a>
            <a href="/register" class="btn btn-warning">Register</a>
        </div>
    </div>
</nav>

<!-- Hero Section -->
<div class="container text-center d-flex align-items-center justify-content-center" style="height: 70vh;">
    <div class="glass-card col-md-8">
        <h1 class="display-4 fw-bold">Track Your Job Applications</h1>
        <p class="lead mt-3">
            Manage your job applications, monitor interview progress,
            and stay organized in one place.
        </p>

        <div class="mt-4">
            <a href="/register" class="btn btn-primary btn-lg me-3">Get Started</a>
            <a href="/login" class="btn btn-outline-light btn-lg">Login</a>
        </div>
    </div>
</div>

<footer class="fixed-bottom text-center p-3">
    <small>© 2026 Tracker. Built with Spring Boot & MongoDB.</small>
</footer>

</body>
</html>
