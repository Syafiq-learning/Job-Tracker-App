<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

        <div class="glow-circle"></div>
    <div class="glow-circle alt"></div>
    <div class="container auth-wrapper">
        <div class="glass-card auth-card">
            <a href="/" class="back-link">&larr; Back to Home</a>
            <div class="brand-badge">&#128188;</div>
            <h3 style="text-align:center; font-weight: bold;">Register</h3>
            <p style="text-align:center">Register your account</p>
            <div class="card-body p-4">
                <form>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <button class="btn btn-primary mt-3 w-100">
                        Register
                    </button>

                    <p class="mt-4">Already have an account?</p>
                    <a href="/login">Sign In</a>

                </form>

            </div>

        </div>
    </div>

</body>
</html>
