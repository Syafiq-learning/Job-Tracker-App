<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

        <div class="container min-vh-50 d-flex justify-content-center align-item-center mt-4 mb-4">
        <div class="glass-card rounded-4 shadow-lg" style="width:50%;" >
            <h3 style="text-align:center; margin-top:10px; font-weight: bold;">Register</h3>
            <p style="text-align:center">Register your account</p>
            <div class="card-body p-4">
                <form>

                    <div class="mb-3">
                        <label class=form-label">Username</label>
                        <input type="text" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class=form-label">Email</label>
                        <input type="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class=form-label">Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class=form-label">Confirm Password</label>
                        <input type="password" class="form-control" required>
                    </div>

                    <button class="btn btn-primary mt-3 w-100">
                        Login
                    </button>

                    <p class="mt-4">Already have an account?</p>
                    <a href="login.html">Sign In</a>

                </form>

            </div>

        </div>
    </div>

</body>
</html>
