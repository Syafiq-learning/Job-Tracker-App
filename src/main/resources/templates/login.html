<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="glow-circle"></div>
    <div class="container min-vh-50 d-flex justify-content-center align-item-center mt-4 mb-4">
        <div class="glass-card rounded  -4 shadow-lg w-50 " >
            <h3 style="text-align:center; font-weight: bold" class="mt-4">Job Tracker</h3>
            <p style="text-align:center">Track Your Job Applications</p>
            <div class="card-body p-4 ">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control">
                    </div>

                    <button class="btn btn-primary mt-3 w-100">
                        Login
                    </button>

                    <p class="mt-4">Don't have an account?</p>
                    <a>Register</a>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
