<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <div class="glow-circle"></div>
    <div class="glow-circle alt"></div>
    <div class="container auth-wrapper">
        <div class="glass-card auth-card">
            <a href="/" class="back-link">&larr; Back to Home</a>
            <div class="brand-badge">&#128188;</div>
            <h3 style="text-align:center; font-weight: bold">Job Tracker</h3>
            <p style="text-align:center">Track Your Job Applications</p>
            <div class="card-body p-4 ">
                <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
                <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
                <div th:if="${param.registered}" class="alert alert-success">Registration successful. Please log in.</div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button class="btn btn-primary mt-3 w-100">
                        Login
                    </button>

                    <p class="mt-4">Don't have an account?</p>
                    <a href="/register">Register</a>

                </form>
            </div>
        </div>
    </div>
</body>
</html>
